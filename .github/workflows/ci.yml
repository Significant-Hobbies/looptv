name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare pnpm
        run: |
          corepack enable
          if node -e "const pm=require('./package.json').packageManager||''; process.exit(pm.startsWith('pnpm@')?0:1)"; then
            corepack install
          else
            corepack prepare pnpm@10.32.1 --activate
          fi
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install lizard==1.23.0
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build playback measurement fixture
        env:
          PUBLIC_POSTHOG_KEY: measurement-test
        run: pnpm build
      - name: Verify playback measurement against the iframe callback
        env:
          PUBLIC_POSTHOG_KEY: measurement-test
        run: pnpm exec playwright test --config=playwright.playback.config.ts tests/playback-measurement.spec.ts --project=chromium --workers=1
      - name: Retain synthetic playback regression trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-measurement-trace
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
      - run: pnpm quality
